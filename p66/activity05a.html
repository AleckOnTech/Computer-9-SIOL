<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Data and Variables</title>
</head>
<body>
   <!-- GAWA TO NI ALECK BERNAL -->
   <!-- Header Area -->
   <h1>Area of a rectangle</h1>

   <!-- Script Area -->
   <script>
      // Input and Calculate
      let inputLength = parseFloat(prompt("Enter Length here", ""));
      let inputWidth = parseFloat(prompt("Enter Width here", ""));
      let answer = inputLength * inputWidth;
      // Print
      document.write("The area of a " + inputLength + " x " + inputWidth + " rectangle is " + answer + " depending on what unit is");
      console.log("The area of a " + inputLength + " x " + inputWidth + " rectangle is " + answer + " depending on what unit is ")
   </script>
</body>
</html>
