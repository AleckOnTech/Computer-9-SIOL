<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Data and Variables</title>
</head>
<body>
   <!-- GAWA TO NI ALECK BERNAL -->
   <!-- Header Area -->
   <h1>Farenheit to Celcius Conversion</h1>

   <!-- Script Area -->
   <script>
      // Input and Calculate
      let inputToNum = parseFloat(prompt("Enter your temperature (Farenheit)", ""));
      let math1 = inputToNum - 32;
      let math2 =  math1 * 5/9;
      let answer = Math.round(math2 * 100)/100;
      // Print
      document.write("The equivalent of ", inputToNum, " Farenheit is ", answer, " Celcius");
      console.log("The equivalent of ", inputToNum, " Farenheit is ", answer, " Celcius")
   </script>
</body>
</html>
